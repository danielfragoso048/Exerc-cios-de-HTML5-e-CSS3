<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira tabela</title>
</head>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    table {
        width: 400px;
        height: 400px;
        border-collapse: collapse;
        border: 5px solid red;
    }

    tr.linha {
        background-color: gray;
    }

    td {
        border: 1px solid black;
        text-align: center;
        vertical-align: middle;
        /*aloca as posições dos dados dentro das caixas horizontalmente (esquerda, direita ...) ou usar o vertical align para alinhar verticalmente ( top, middle e bottom) */
    }

    .numero {
        text-align: right;
    }

    td.dado {
        background-color: yellow;
    }

</style>
<body>
    <h1>Minha primeira tabela</h1>
    <!--HIERARQUI DE TABELAS (simples)
        TABLE ROW = linha de tabela 
            TABLE HEADER = cabeçalho de tabela
            TABLE DATA = dado de tabela
    
    
    
    -->    <!--pode-se colocar border no td e aumentar a width da table (tabela) para formar as linhas de tabela e para aumentar a proximidade das linhas é só colocar border collapse collapse (separate é o padrão)-->
    <table>   <!-- Primeira linha,, o fechamento do td e tr não são obrigatorios segundo o W3-->
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha"> <!-- Segunda linha-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td> <!-- terceira linha-->
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td> <!-- Quarta linha-->
            <td class="dado">B4</td>
            <td>C4</td>
        </tr>
       
    </table>
</body>
</html>
