<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <form>
        <p>Nome: <input type="text" name="nome" id="nome"></p> <!--input text faz com que a se crie a caixinha para colocar texto-->
        <p>Sobrenome: <input type="text" name="sobrenome" id="sobrenome"></p>
        <p><input type="submit" value="Enviar"></p> <!--esse formulario serve para criar um  botão de enviar o formulário com o value sendo o que aparece escrito no botão
        
        é importante que haja uma ligação entre o nome que vai aparecer ao lado da caixa de texto e a caixa de texto para o navegador reconhecer o formulário-->
    </form>
</body>
</html>
